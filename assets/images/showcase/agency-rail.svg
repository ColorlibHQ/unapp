<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><title>Halden Rail: one railway identity across a station sign and three route cards</title><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#122f2c" flood-opacity=".13"/></filter></defs><rect x="0" y="0" width="1200" height="900" rx="0" fill="#e4e9ec" /><rect x="90" y="100" width="1020" height="300" rx="12" fill="#163e58" filter="url(#shadow)"/><text x="140" y="220" font-family="Arial, sans-serif" font-size="65" font-weight="700" fill="#f1f6ed" >H / HALDEN RAIL</text><text x="145" y="312" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#f1f6ed" >One network. Every direction.</text><rect x="90" y="455" width="324" height="315" rx="10" fill="#edbc59" filter="url(#shadow)"/><text x="114" y="511" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#163e58" >H /</text><text x="114" y="648" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#163e58" >NORTH</text><text x="114" y="716" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#163e58" >→ Platform 1</text><rect x="438" y="455" width="324" height="315" rx="10" fill="#75c6bd" filter="url(#shadow)"/><text x="462" y="511" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#163e58" >H /</text><text x="462" y="648" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#163e58" >COAST</text><text x="462" y="716" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#163e58" >→ Platform 2</text><rect x="786" y="455" width="324" height="315" rx="10" fill="#dca28c" filter="url(#shadow)"/><text x="810" y="511" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#163e58" >H /</text><text x="810" y="648" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#163e58" >VALLEY</text><text x="810" y="716" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#163e58" >→ Platform 3</text></svg>
